server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://ehr-api-canadacentral.azurewebsites.net/api/;
        proxy_set_header Host ehr-api-canadacentral.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /swagger/ {
        proxy_pass https://ehr-api-canadacentral.azurewebsites.net/swagger/;
        proxy_set_header Host ehr-api-canadacentral.azurewebsites.net;
        proxy_ssl_server_name on;
    }

    location /health {
        proxy_pass https://ehr-api-canadacentral.azurewebsites.net/health;
        proxy_set_header Host ehr-api-canadacentral.azurewebsites.net;
        proxy_ssl_server_name on;
    }
}
